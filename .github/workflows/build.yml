name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller tkinterdnd2

      - name: 下载并解压 UPX
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "."
          mv upx-4.2.4-win64 upx

      - name: 打包 exe
        run: |
          pyinstaller --onedir --noconsole --name ImgConverter --clean --collect-all PIL --hidden-import PIL._webp --collect-all tkinterdnd2 --exclude-module PyQt5 --exclude-module PySide2 --upx-dir ./upx webp2jpg_gui.py

      - name: 压缩为 ZIP
        run: |
          Compress-Archive -Path dist/ImgConverter/* -DestinationPath dist/ImgConverter.zip

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: img-converter-windows-exe
          path: dist/ImgConverter.zip
