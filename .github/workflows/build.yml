name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller

      - name: 打包 exe
        run: |
          pyinstaller --onefile --name webp2jpg --clean webp2jpg.py

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: webp2jpg-windows-exe
          path: dist/webp2jpg.exe
